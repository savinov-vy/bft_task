vaadin:
  launch-browser: true

server:
  port: 8209

spring:
  main:
    allow-bean-definition-overriding: true
  thymeleaf:
    check-template-location: false
  jpa:
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    show-sql: true
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    hibernate:
      ddl-auto: validate

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5437/bft_task_db
    username: root
    password: root

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml